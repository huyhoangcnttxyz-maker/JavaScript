<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tính số ngày trong tháng</title>
  </head>
  <body>
    <h2>Tính số ngày trong tháng</h2>
    <input
      type="number"
      id="thang"
      placeholder="Nhập số thứ tự tháng (1-12)..."
    />
    <button onclick="tinhSoNgay()">Tính số ngày</button>
    <p id="ketQuaNgay"></p>

    <script>
      function tinhSoNgay() {
        let thang = parseInt(document.getElementById("thang").value);
        let thongBao = "";

        switch (thang) {
          case 1:
          case 3:
          case 5:
          case 7:
          case 8:
          case 10:
          case 12:
            thongBao = `Tháng ${thang} có 31 ngày`;
            break;
          case 4:
          case 6:
          case 9:
          case 11:
            thongBao = `Tháng ${thang} có 30 ngày`;
            break;
          case 2:
            thongBao = `Tháng 2 có 28 hoặc 29 ngày`;
            break;
          default:
            thongBao = "Tháng không hợp lệ! Vui lòng nhập từ 1 đến 12.";
            break;
        }

        document.getElementById("ketQuaNgay").innerText = thongBao;
      }
    </script>
  </body>
</html>

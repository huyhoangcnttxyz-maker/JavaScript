<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đổi năm dương lịch sang âm lịch</title>
  </head>
  <body>
    <script>
      let nam_duong_lich = parseInt(prompt("Nhập vào năm dương lịch:"));

      if (!isNaN(nam_duong_lich)) {
        let du_can = nam_duong_lich % 10;
        let du_chi = nam_duong_lich % 12;

        let can = "";
        let chi = "";

        // Tra bảng Can (Năm dương % 10)
        switch (du_can) {
          case 0:
            can = "Canh";
            break;
          case 1:
            can = "Tân";
            break;
          case 2:
            can = "Nhâm";
            break;
          case 3:
            can = "Quý";
            break;
          case 4:
            can = "Giáp";
            break;
          case 5:
            can = "Ất";
            break;
          case 6:
            can = "Bính";
            break;
          case 7:
            can = "Đinh";
            break;
          case 8:
            can = "Mậu";
            break;
          case 9:
            can = "Kỷ";
            break;
        }

        // Tra bảng Chi (Năm dương % 12)
        switch (du_chi) {
          case 0:
            chi = "Thân";
            break;
          case 1:
            chi = "Dậu";
            break;
          case 2:
            chi = "Tuất";
            break;
          case 3:
            chi = "Hợi";
            break;
          case 4:
            chi = "Tý";
            break;
          case 5:
            chi = "Sửu";
            break;
          case 6:
            chi = "Dần";
            break;
          case 7:
            chi = "Mẹo";
            break;
          case 8:
            chi = "Thìn";
            break;
          case 9:
            chi = "Tỵ";
            break;
          case 10:
            chi = "Ngo";
            break;
          case 11:
            chi = "Mùi";
            break;
        }

        let nam_am_lich = can + " " + chi;
        alert("Năm âm lịch: " + nam_am_lich);
      } else {
        alert("Vui lòng nhập số năm hợp lệ!");
      }
    </script>
  </body>
</html>
